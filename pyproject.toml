[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas-viz"
version = "0.2.2"
description = "Zero-config local codebase architecture & call-graph visualizer with an interactive Svelte UI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "kutyfuty"}
]
keywords = ["cli", "call-graph", "ast", "architecture", "visualizer", "developer-tools", "svelte"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kutyfuty/codeatlas"
Repository = "https://github.com/kutyfuty/codeatlas"
Issues = "https://github.com/kutyfuty/codeatlas/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeatlas = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
